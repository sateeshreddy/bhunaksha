    <script>
        // Add any necessary JavaScript code here
        $(document).ready(function () {
            // Initialize Select2
            $('#mySelect2').select2({
                placeholder: "Select a village",
                allowClear: true 
            });

            // 2. Listen to the select event
            $('#mySelect2').on('select2:select', function (e) {
                var selectedUrl = "./map.html?code=" + e.params.data.id;

                // 3. Open the page
                if (selectedUrl) {
                    window.location.href = selectedUrl; // Opens in the current tab
                    // window.open(selectedUrl, '_blank'); // Uncomment to open in a new tab
                }
            });
        });
    </script>
